# Builds a static export and publishes it to GitHub Pages.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
# See docs/deployment.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deployment finish; queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Read Pages settings
        id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Check
        run: npm run check

      - name: Build static site
        run: npm run build:static
        env:
          # `/repo-name` for project sites, empty for user sites and custom domains.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Set a repository variable SITE_URL to override, for example with a custom domain.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}

      # Without this file, GitHub Pages ignores folders starting with an underscore, such as _next.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
